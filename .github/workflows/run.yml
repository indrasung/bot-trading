name: Bot Street Smarts

on:
  schedule:
    # Berjalan 5 menit setelah candle H4 tutup (UTC): 00:05, 04:05, 08:05, 12:05, 16:05, 20:05
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch: # Tombol untuk tes manual

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Library
        run: pip install requests pandas yfinance numpy

      - name: Jalankan Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
