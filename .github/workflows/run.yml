name: Bot Pemindai Trading

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Library
        run: |
          pip install requests pandas yfinance

      - name: Jalankan Bot
        run: |
          python bot.py
