name: Bot Street Smarts Real-Time

on:
  schedule:
    - cron: '*/5 * * * *' # Jalan setiap 5 menit
  workflow_dispatch:

# WAJIB: Izin agar bot bisa menyimpan file JSON ke repo
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Library
        run: pip install requests pandas numpy biquote

      - name: Jalankan Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Simpan Memori (State) ke GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add state.json active_setups.json || true
          git commit -m "Update state [skip ci]" || true
          git pull --rebase origin main
          git push origin main || true
